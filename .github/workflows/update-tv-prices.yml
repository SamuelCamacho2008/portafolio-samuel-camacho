name: Actualizar Precios de Televisores

on:
  schedule:
    # Ejecutar todos los días a las 11:00 UTC (6:00 AM hora de Colombia)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Ejecutar Scraper Multi-Retail (Éxito, Falabella y Jumbo)
        run: |
          cd proyectos/tv-scraper
          python retail_scraper_3_tiendas.py

      - name: Comprobar cambios y hacer commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proyectos/tv-scraper/precios_retail_verificados.json proyectos/tv-scraper/comparativa_3_tiendas.csv
          if git diff --staged --quiet; then
            echo "No hay variaciones en los precios detectados hoy."
          else
            git commit -m "chore(precios): actualización diaria automática de precios [skip ci]"
            git push
          fi
